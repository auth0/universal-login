name: RL Scan
run-name: rl-scan

# Reusable malware-scan workflow, called from release.yml (job `rl-scan`), which
# gates the npm publish on it. The trigger lives in the calling workflow; this
# workflow builds and packs the workspace packages, then scans the tarball named
# by `artifact-path`.
#
# Caller pattern (see release.yml):
#   jobs:
#     rl-scan:
#       uses: ./.github/workflows/rl.yml
#       with:
#         artifact-name: auth0-acul-js
#         artifact-path: auth0-auth0-acul-js-1.2.3.tgz
#         version: 1.2.3
#       secrets:
#         RLSECURE_LICENSE: ${{ secrets.RLSECURE_LICENSE }}
#         # ...and the other required secrets listed below
#
# Artifact contract
# ─────────────────
# artifact-path MUST be a concrete file path — the action's internal existence
# check uses [ -f ], which does NOT expand globs. A missing artifact fails the job.
#
# Required org secrets (configured at org level in auth0/):
#   RLSECURE_LICENSE            — ReversingLabs license key
#   RLSECURE_SITE_KEY           — ReversingLabs site key
#   SIGNAL_HANDLER_TOKEN        — scan-service telemetry auth
#   SIGNAL_HANDLER_DOMAIN       — scan-service endpoint domain
#   PRODSEC_TOOLS_ARN           — AWS role ARN for ProdSec tools
#   PRODSEC_TOOLS_USER          — ProdSec Python tools repo user
#   PRODSEC_TOOLS_TOKEN         — ProdSec Python tools repo token
#   PRODSEC_PYTHON_TOOLS_REPO   — ProdSec Python tools repo URL

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name assigned to the artifact (used for RL reporting)
        type: string
        required: true
      artifact-path:
        description: Concrete file path of the built artifact on the runner — no globs
        type: string
        required: true
      version:
        description: Version string for the artifact (e.g. release tag)
        type: string
        required: true
    secrets:
      RLSECURE_LICENSE:
        required: true
      RLSECURE_SITE_KEY:
        required: true
      SIGNAL_HANDLER_TOKEN:
        required: true
      SIGNAL_HANDLER_DOMAIN:
        required: true
      PRODSEC_TOOLS_ARN:
        required: true
      PRODSEC_TOOLS_USER:
        required: true
      PRODSEC_TOOLS_TOKEN:
        required: true
      PRODSEC_PYTHON_TOOLS_REPO:
        required: true

permissions:
  contents: read

jobs:
  # ── Malware scan via ReversingLabs composite action ─────────────────────────
  rl-scan:
    name: RL Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for AWS OIDC federation (PRODSEC_TOOLS_ARN)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Build the artifact ────────────────────────────────────────────────────
      # Builds both workspaces and packs them into the workspace root. `artifact-path`
      # (from the caller) selects the tarball of the package being released; the
      # rl-scan action uses [ -f ] to verify that file exists. Dependency lifecycle
      # scripts are skipped (--ignore-scripts) because this job also holds the AWS
      # OIDC token and the scan secrets.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root --ignore-scripts

      - name: Build packages
        run: npm run build:local

      - name: Pack npm tarballs
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          npm pack --workspaces --ignore-scripts --pack-destination "$GITHUB_WORKSPACE"
          if [ ! -f "$ARTIFACT_PATH" ]; then
            echo "::error title=Artifact::expected tarball not found: $ARTIFACT_PATH"
            ls -la "$GITHUB_WORKSPACE"/*.tgz || true
            exit 1
          fi

      - name: Run RL malware scan
        id: rl-scan-conclusion
        uses: auth0/devsecops-tooling/.github/actions/rl-scan@e29f26478db18ff0bcbe4bc447a8fbd54fbeec9e
        with:
          # ── Artifact inputs ─────────────────────────────────────────────────
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: ${{ inputs.artifact-path }}
          version: ${{ inputs.version }}
          # ── Required secrets ────────────────────────────────────────────────
          RLSECURE_LICENSE:          ${{ secrets.RLSECURE_LICENSE }}
          RLSECURE_SITE_KEY:         ${{ secrets.RLSECURE_SITE_KEY }}
          SIGNAL_HANDLER_TOKEN:      ${{ secrets.SIGNAL_HANDLER_TOKEN }}
          SIGNAL_HANDLER_DOMAIN:     ${{ secrets.SIGNAL_HANDLER_DOMAIN }}
          PRODSEC_TOOLS_ARN:         ${{ secrets.PRODSEC_TOOLS_ARN }}
          PRODSEC_TOOLS_USER:        ${{ secrets.PRODSEC_TOOLS_USER }}
          PRODSEC_TOOLS_TOKEN:       ${{ secrets.PRODSEC_TOOLS_TOKEN }}
          PRODSEC_PYTHON_TOOLS_REPO: ${{ secrets.PRODSEC_PYTHON_TOOLS_REPO }}

      - name: Gate on scan result
        if: always()
        env:
          SCAN_STATUS: ${{ steps.rl-scan-conclusion.outputs.scan-status }}
        run: |
          if [ "$SCAN_STATUS" != "success" ]; then
            echo "::error title=Malware::RL scan did not pass (status: ${SCAN_STATUS:-none})"
            exit 1
          fi
