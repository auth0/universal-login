name: Publish release to npm

inputs:
  node-version:
    required: true
  
  version:
    required: true
  require-build:
    required: true
  package:
    required: true
  release-directory:
    required: true

runs:
  using: composite

  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm
      shell: bash
      run: npm install -g npm@11.10.0

    - name: Install dependencies
      shell: bash
      run: npm ci --workspaces --include-workspace-root

    - name: Build package
      if: inputs.require-build == 'true'
      shell: bash
      run: |
        npm run build:local --workspace @auth0/auth0-acul-js
        if [ "${{ inputs.package }}" = "auth0-acul-react" ]; then
          npm run build:local --workspace @auth0/auth0-acul-react
        fi

    - name: Publish release to NPM
      working-directory: packages/${{ inputs.release-directory }}
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ "${VERSION}" == *"beta"* ]]; then
          TAG="beta"
        elif [[ "${VERSION}" == *"alpha"* ]]; then
          TAG="alpha"
        else
          TAG="latest"
        fi
        npm publish --access public --tag $TAG
      shell: bash